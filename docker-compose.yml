services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diklat_app
    restart: always
    ports:
      - "8090:80"
    environment:
      - APP_NAME=Sistem Diklat RSU Prima Medika
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=base64:UiGcc6G3JUG0sMx176lHU2u5c3vbXWcOAaB9yFVQs5s=
      - APP_URL=http://localhost:8090
      - APP_TIMEZONE=Asia/Makassar
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=sistem_diklat
      - DB_USERNAME=diklat_user
      - DB_PASSWORD=Password123!
      - CACHE_DRIVER=file
      - CACHE_STORE=file
      - SESSION_DRIVER=file
      - SESSION_LIFETIME=120
      - QUEUE_CONNECTION=sync
      - FILESYSTEM_DISK=public
      - LOG_CHANNEL=stack
      - LOG_LEVEL=error
    volumes:
      - storage_data:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: diklat_db
    restart: always
    command: --require-secure-transport=OFF
    environment:
      - MYSQL_DATABASE=sistem_diklat
      - MYSQL_USER=diklat_user
      - MYSQL_PASSWORD=Password123!
      - MYSQL_ROOT_PASSWORD=RootPassword123!
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: diklat_scheduler
    restart: always
    environment:
      - APP_NAME=Sistem Diklat RSU Prima Medika
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=base64:UiGcc6G3JUG0sMx176lHU2u5c3vbXWcOAaB9yFVQs5s=
      - APP_URL=http://localhost:8090
      - APP_TIMEZONE=Asia/Makassar
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=sistem_diklat
      - DB_USERNAME=diklat_user
      - DB_PASSWORD=Password123!
      - CACHE_DRIVER=file
      - CACHE_STORE=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
  storage_data: