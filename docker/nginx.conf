server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        # Semua traffic yang masuk lewat tunnel (ngrok/cloudflared) itu HTTPS
        # di sisi pengunjung, walau yang diterima nginx di sini plain HTTP.
        # Tanpa ini, Laravel mengira requestnya HTTP biasa dan generate
        # link/aset dengan skema/port yang salah.
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param SERVER_NAME 127.0.0.1;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }
}